function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function api(action,payload={},silent=false){const r=await fetch(API_BASE+'/api/state',{method:action?'POST':'GET',headers:{'content-type':'application/json'},body:action?JSON.stringify({action,...payload}):undefined}),data=await r.json();if(!r.ok)throw Error(data.error||'同步失败');state=data;if(!state.members.includes(actor)){actor=state.members[0];localStorage.actor=actor}checkNotifications();if(!silent)render();return state}
function notificationInbox(){const items=(state.notifications||[]).filter(x=>x.to===actor).slice(-3).reverse();return items.length?'<section class="notice-card"><b>给 '+esc(actor)+' 的新消息</b>'+items.map(x=>'<p>'+esc(x.message)+' · '+ago(x.at)+'</p>').join('')+'</section>':''}function checkNotifications(){const seen=JSON.parse(localStorage.seenNotifications||'[]'),fresh=(state.notifications||[]).filter(x=>x.to===actor&&!seen.includes(x.id));if(!fresh.length)return;const latest=fresh.at(-1);localStorage.seenNotifications=JSON.stringify([...seen,...fresh.map(x=>x.id)].slice(-100));toast(latest.message);if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&'serviceWorker'in navigator)navigator.serviceWorker.ready.then(reg=>reg.showNotification('我们的小家 '+latest.emoji,{body:latest.message,tag:latest.id,icon:location.hostname==='chaojiabin.github.io'?'./icon.svg':'/icon.svg'})).catch(()=>{})}async function enableNotifications(){if(typeof Notification==='undefined')return toast('这台设备不支持系统通知');const result=await Notification.requestPermission();render();toast(result==='granted'?'系统通知已开启':'未获得通知权限')}
function totals(){const out=Object.fromEntries(state.members.map(x=>[x,0]));state.entries.forEach(e=>out[e.actor]=(out[e.actor]||0)+e.points);state.redemptions.filter(x=>x.type==='个人').forEach(x=>out[x.actor]=(out[x.actor]||0)-x.cost);(state.tips||[]).forEach(x=>{out[x.from]=(out[x.from]||0)-Number(x.amount||0);out[x.to]=(out[x.to]||0)+Number(x.amount||0)});return out}
function earnedTotals(){const out=Object.fromEntries(state.members.map(x=>[x,0]));state.entries.forEach(e=>out[e.actor]=(out[e.actor]||0)+Number(e.points||0));return out}function scoreBalance(){const s=earnedTotals(),left=state.members[0],right=state.members[1],a=s[left]||0,b=s[right]||0,diff=b-a,angle=Math.max(-10,Math.min(10,diff/Math.max(20,a+b)*18)),message=a===b?'势均力敌':a>b?left+' 暂时领先 '+(a-b)+' 分':right+' 暂时领先 '+(b-a)+' 分';return '<section class="balance-card"><div class="balance-title"><b>家务比分</b><span>'+esc(message)+'</span></div><div class="scale"><div class="scale-beam" style="transform:rotate('+angle+'deg)"><div class="scale-side scale-left"><strong>'+a+'</strong><small>'+esc(left)+'</small></div><div class="scale-side scale-right"><strong>'+b+'</strong><small>'+esc(right)+'</small></div></div><div class="scale-post">⚖</div></div></section>'}
function todayEntries(){const d=new Date().toDateString();return state.entries.filter(e=>new Date(e.at).toDateString()===d)}function ago(s){const m=Math.floor((Date.now()-new Date(s))/60000);return m<1?'刚刚':m<60?m+' 分钟前':m<1440?Math.floor(m/60)+' 小时前':Math.floor(m/1440)+' 天前'}
function shell(content){return '<div class="shell"><header class="top"><div><div class="eyebrow">TOGETHER AT HOME</div><h1>我们的小家</h1></div><button class="avatar" onclick="openProfile()">'+esc(actor.slice(0,2))+'</button></header>'+content+'</div><nav class="nav">'+[['today','⌂','今天'],['tasks','✓','家务'],['wishes','♡','心愿'],['statement','▤','汇总'],['us','♧','我们']].map(n=>'<button class="'+(page===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</nav>'+(page==='us'?'<button class="fab" aria-label="修改名字" onclick="editNames()">✎</button>':'')}
function render(){if(!state)return;let c=page==='today'?today():page==='tasks'?tasks():page==='wishes'?wishes():page==='statement'?statement():us();$('#app').innerHTML=shell(c)}function go(p){page=p;render();scrollTo(0,0)}
function today(){const t=totals(),es=todayEntries(),quick=state.tasks.filter(x=>x.active).slice(0,6);return notificationInbox()+'<section class="hero"><small>今天，我们一起让家变好了</small><h2>'+es.length+' 件小事</h2><div class="scores">'+state.members.map(m=>'<div class="score"><small>'+esc(m)+'</small><b>'+t[m]+'<small> 分</small></b></div>').join('')+'</div></section>'+scoreBalance()+'<div class="section-head"><h3>快速记录</h3><button onclick="go(\'tasks\')">全部家务 →</button></div><div class="quick">'+quick.map(taskCard).join('')+'</div><div class="section-head"><h3>今天的足迹</h3><button onclick="thanks()">写句感谢</button></div><div class="feed">'+(es.length?es.slice().reverse().map(feedItem).join(''):'<div class="empty">还没有记录，完成一件小事吧。</div>')+'</div>'}
function taskIcon(t){return t.icon||icons[t.category]||'✨'}function taskCard(t){return '<button class="task" onclick="complete(\''+t.id+'\')"><span class="ico">'+taskIcon(t)+'</span><b>'+esc(t.name)+'</b><span class="pts">+'+t.points+' 分</span></button>'}function reactionBar(e){const reactions=e.reactions||{},values=Object.values(reactions);return '<div class="reaction-row">'+['👍','👎','😠','😑'].map(x=>'<button class="reaction '+(reactions[actor]===x?'active':'')+'" onclick="react(\''+e.id+'\',\''+x+'\')">'+x+(values.filter(v=>v===x).length?' '+values.filter(v=>v===x).length:'')+'</button>').join('')+(e.actor!==actor?'<button class="reaction tip-reaction" onclick="tipPoints(\''+e.id+'\')">🎁 打赏</button>':'')+'</div>'}async function react(entryId,emoji){try{await api('react',{entryId,actor,emoji});toast('反应已发送给对方')}catch(e){toast(e.message)}}function feedItem(e){return '<div class="feed-item"><div class="bubble">'+(e.icon||icons[e.category]||'✨')+'</div><main><b>'+esc(e.actor)+' · '+esc(e.name)+'</b><p>'+ago(e.at)+'</p>'+reactionBar(e)+'</main><span class="pts">+'+e.points+'</span><button aria-label="删除这条足迹" style="border:0;background:#fff1ed;color:var(--red);padding:8px 10px;border-radius:11px;font-size:12px;font-weight:700" onclick="askDeleteEntry(\''+e.id+'\')">删除</button></div>'}
function tasks(){const cats=['全部',...new Set(state.tasks.map(x=>x.category))],list=state.tasks.filter(x=>(showArchived?!x.active:x.active)&&(filter==='全部'||x.category===filter));return '<div class="section-head"><h3>'+(showArchived?'已停用项目':'家务库')+'</h3>'+(showArchived?'<button onclick="toggleArchived()">返回使用中</button>':'<div><button onclick="toggleArchived()">停用项</button><button class="primary" style="padding:8px 11px;margin-left:6px" onclick="newTask()">添加家务 ＋</button></div>')+'</div><div class="filters">'+cats.map(c=>'<button class="chip '+(filter===c?'active':'')+'" onclick="setFilter(\''+c+'\')">'+(icons[c]||'✨')+' '+esc(c)+'</button>').join('')+'</div><div class="list">'+(list.length?list.map(t=>'<div class="list-task '+(!t.active?'archived':'')+'"><div class="ico">'+taskIcon(t)+'</div><main><b>'+esc(t.name)+'</b><small>'+esc(t.category)+' · '+t.points+' 分</small></main><button class="manage" aria-label="编辑" onclick="editTask(\''+t.id+'\')">•••</button>'+(t.active?'<button class="done" onclick="complete(\''+t.id+'\')">完成</button>':'')+'</div>').join(''):'<div class="empty">这里还没有项目。</div>')+'</div>'}function setFilter(c){filter=c;render()}function toggleArchived(){showArchived=!showArchived;filter='全部';render()}
function wishCards(list,t){return '<div class="wish-grid">'+list.map(r=>{const joint=r.type==='共同',p=joint?Number(r.progress||0):Number(r.progressByActor?.[actor]||0),done=joint?Boolean(r.redeemed):Boolean(r.redeemedByActor?.[actor]),records=state.redemptions.filter(x=>x.rewardId===r.id).length,comments=(state.rewardComments||[]).filter(x=>x.rewardId===r.id).length;return '<article class="wish"><button class="wish-manage" aria-label="编辑心愿" onclick="editReward(\''+r.id+'\')">•••</button><div class="wish-icon">'+r.icon+'</div><h4>'+esc(r.name)+'</h4><small>'+(joint?'共同投入':'单独投入')+' · '+r.cost+' 分</small><div class="bar"><i style="width:'+Math.min(100,p/r.cost*100)+'%"></i></div><small>已投入 '+Math.min(p,r.cost)+' / '+r.cost+'</small><br><small>当前还可投入 '+Math.max(0,t[actor]||0)+' 分</small><button '+(done?'disabled':'')+' onclick="reward(\''+r.id+'\')">'+(done?'已经实现':'手动投入')+'</button><button class="wish-detail" onclick="rewardDetail(\''+r.id+'\')">查看记录 '+records+' · 留言 '+comments+'</button></article>'}).join('')+'</div>'}function wishes(){const t=totals(),joint=state.rewards.filter(r=>r.type==='共同'),solo=state.rewards.filter(r=>r.type!=='共同');return '<section class="hero"><small>'+esc(actor)+'的可用积分</small><h2>'+Math.max(0,t[actor])+' 分</h2><p style="margin:0;opacity:.7;font-size:13px">赚取积分不会自动推进心愿，投入均需手动确认</p></section><div class="section-head"><h3>共同投入</h3><button onclick="newWish()">添加心愿 ＋</button></div>'+wishCards(joint,t)+'<div class="section-head"><h3>单独投入</h3></div>'+wishCards(solo,t)}
function setStatementMode(mode){statementMode=mode;render()}function changeStatementPeriod(delta){if(statementMode==='month')statementDate=new Date(statementDate.getFullYear(),statementDate.getMonth()+delta,1);else statementDate=new Date(statementDate.getFullYear()+delta,statementDate.getMonth(),1);render()}function statementEntries(){const y=statementDate.getFullYear(),m=statementDate.getMonth();return state.entries.filter(e=>{const d=new Date(e.at);return d.getFullYear()===y&&(statementMode==='year'||d.getMonth()===m)})}function statement(){const es=statementEntries(),y=statementDate.getFullYear(),m=statementDate.getMonth(),label=statementMode==='month'?y+' 年 '+(m+1)+' 月':y+' 年';return '<div class="statement-switch"><button class="'+(statementMode==='month'?'active':'')+'" onclick="setStatementMode(\'month\')">月度账单</button><button class="'+(statementMode==='year'?'active':'')+'" onclick="setStatementMode(\'year\')">年度总结</button></div><div class="period-nav"><button onclick="changeStatementPeriod(-1)">‹</button><b>'+label+'</b><button onclick="changeStatementPeriod(1)">›</button></div>'+(statementMode==='month'?monthlyStatement(es):yearlyStatement(es))+wishStatement()}function wishStatement(){const y=statementDate.getFullYear(),m=statementDate.getMonth(),period=state.redemptions.filter(x=>{const d=new Date(x.at);return d.getFullYear()===y&&(statementMode==='year'||d.getMonth()===m)});return '<div class="section-head"><h3>心愿投入记录</h3></div><div class="wish-statement">'+state.rewards.map(r=>{const rows=period.filter(x=>x.rewardId===r.id),amount=rows.reduce((n,x)=>n+Number(x.cost||0),0),comments=(state.rewardComments||[]).filter(x=>x.rewardId===r.id).length;return '<button onclick="rewardDetail(\''+r.id+'\')"><span>'+r.icon+' '+esc(r.name)+'</span><small>'+amount+' 分 · '+rows.length+' 笔 · '+comments+' 条留言</small></button>'}).join('')+'</div>'}function monthlyStatement(es){const members=state.members,groups={};es.forEach(e=>{groups[e.name]||={points:0,counts:Object.fromEntries(members.map(x=>[x,0])),scores:Object.fromEntries(members.map(x=>[x,0]))};groups[e.name].counts[e.actor]=(groups[e.name].counts[e.actor]||0)+1;groups[e.name].scores[e.actor]=(groups[e.name].scores[e.actor]||0)+Number(e.points||0)});const totals=Object.fromEntries(members.map(x=>[x,es.filter(e=>e.actor===x).reduce((n,e)=>n+Number(e.points||0),0)]));const rows=Object.entries(groups).sort((a,b)=>Object.values(b[1].counts).reduce((n,x)=>n+x,0)-Object.values(a[1].counts).reduce((n,x)=>n+x,0));return '<section class="statement-total"><small>本月共完成</small><h2>'+es.length+' 件家务</h2><div>'+members.map(x=>'<span><b>'+totals[x]+'</b> 分<br><small>'+esc(x)+'</small></span>').join('')+'</div></section><div class="statement-head"><b>家务项目</b>'+members.map(x=>'<b>'+esc(x)+'</b>').join('')+'</div><div class="statement-list">'+(rows.length?rows.map(([name,v])=>'<div class="statement-row"><span>'+esc(name)+'</span>'+members.map(x=>'<span><b>'+v.counts[x]+'</b> 次<small>'+v.scores[x]+' 分</small></span>').join('')+'</div>').join(''):'<div class="empty">这个月还没有足迹。</div>')+'</div>'}function yearlyStatement(es){const members=state.members,months=Array.from({length:12},()=>0);es.forEach(e=>months[new Date(e.at).getMonth()]++);const mx=Math.max(1,...months);return '<section class="statement-total"><small>全年共同完成</small><h2>'+es.length+' 件家务</h2><div>'+members.map(x=>{const mine=es.filter(e=>e.actor===x),score=mine.reduce((n,e)=>n+Number(e.points||0),0),counts={};mine.forEach(e=>counts[e.name]=(counts[e.name]||0)+1);const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];return '<span><b>'+score+'</b> 分<br><small>'+esc(x)+' · '+(top?esc(top[0])+'最多':'暂无记录')+'</small></span>'}).join('')+'</div></section><section class="year-chart"><h3>每月完成次数</h3><div class="month-bars">'+months.map((v,i)=>'<div><i style="height:'+Math.max(3,v/mx*90)+'px"></i><b>'+v+'</b><small>'+(i+1)+'月</small></div>').join('')+'</div></section>'}
function us(){const week=[0,0,0,0,0,0,0],now=new Date();state.entries.forEach(e=>{const diff=Math.floor((new Date(now.toDateString())-new Date(new Date(e.at).toDateString()))/86400000);if(diff>=0&&diff<7)week[6-diff]+=e.points});const mx=Math.max(20,...week);const names=['一','二','三','四','五','六','日'];return '<div class="week-card"><div class="eyebrow">过去 7 天</div><h2 style="margin:5px 0">共同完成 '+state.entries.filter(e=>Date.now()-new Date(e.at)<604800000).length+' 件小事</h2><div class="bars">'+week.map((v,i)=>'<div class="day"><i style="height:'+Math.max(4,v/mx*90)+'px"></i>'+names[i]+'</div>').join('')+'</div></div><div class="thanks-card"><h3>谢谢你，让生活更轻一点</h3>'+(state.thanks.length?state.thanks.slice(-4).reverse().map(x=>'<div class="feed-item"><div class="bubble">♡</div><main><b>'+esc(x.from)+' 写给 '+esc(x.to)+'</b><p>'+esc(x.message)+'</p></main></div>').join(''):'<p style="color:var(--muted)">这周还没有感谢留言。</p>')+'<button class="primary" style="margin-top:12px" onclick="thanks()">写一句感谢</button></div><div class="section-head"><h3>设置</h3></div><div class="settings-card"><div class="row"><span>当前记录人</span><b>'+esc(actor)+'</b></div><div class="row"><span>全部记录</span><b>'+state.entries.length+' 条</b></div><div class="row"><button class="text-btn" onclick="enableNotifications()">开启系统通知</button><span>'+(typeof Notification!=='undefined'&&Notification.permission==='granted'?'已开启':'未开启')+'</span></div><div class="row"><button class="text-btn" onclick="exportData()">导出数据备份</button><span>JSON</span></div></div>'}
function modal(body,title){document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>'+title+'</h3><button class="close" onclick="closeModal()">×</button></div>'+body+'</div></div>')}function closeModal(){$('#modal')?.remove()}
function complete(id){const t=state.tasks.find(x=>x.id===id);modal('<p style="color:var(--muted)">谁完成了「'+esc(t.name)+'」？</p><div class="member-pick">'+state.members.map(m=>'<button class="'+(m===actor?'active':'')+'" onclick="confirmComplete(\''+id+'\',\''+m+'\')">'+esc(m)+'<br><b>+'+t.points+' 分</b></button>').join('')+'</div>','记录完成')}async function confirmComplete(taskId,who){closeModal();actor=who;localStorage.actor=who;try{await api('complete',{taskId,actor:who});toast('已记录，+'+state.tasks.find(x=>x.id===taskId).points+' 分')}catch(e){toast(e.message)}}
function askDeleteEntry(entryId){const e=state.entries.find(x=>x.id===entryId);if(!e)return toast('找不到这条足迹');modal('<p>确定删除「<b>'+esc(e.name)+'</b>」吗？</p><p class="hint">记录人：'+esc(e.actor)+' · '+e.points+' 分<br>对应积分会撤回；如已消费，相关投入也会自动调整。</p><button class="danger" onclick="deleteEntry(\''+entryId+'\')">确认删除这条足迹</button>','删除足迹')}async function deleteEntry(entryId){const button=document.querySelector('#modal .danger');if(button){button.disabled=true;button.textContent='正在删除…'}try{await api('deleteEntry',{entryId});closeModal();toast('足迹已删除，积分已调整')}catch(err){if(button){button.disabled=false;button.textContent='确认删除这条足迹'}toast(err.message)}}
function tipPoints(entryId){const entry=state.entries.find(x=>x.id===entryId),t=totals(),available=Math.max(0,t[actor]||0);if(!entry)return toast('找不到这条足迹');if(entry.actor===actor)return toast('不能给自己的足迹打赏');if(available<1)return toast('当前没有可打赏积分');modal('<p style="color:var(--muted)">因为「'+esc(entry.name)+'」打赏给 '+esc(entry.actor)+'，当前可用 '+available+' 分。</p><input id="tipEntryId" type="hidden" value="'+esc(entry.id)+'"><div class="field"><label>打赏积分</label><input id="tipAmount" type="number" inputmode="numeric" min="1" max="'+available+'" placeholder="手动输入积分"></div><div class="field"><label>附言（可选）</label><input id="tipNote" maxlength="80" placeholder="谢谢你今天的付出"></div><button class="primary" style="width:100%" onclick="sendTip()">确认打赏</button>','🎁 打赏积分')}async function sendTip(){const entryId=$('#tipEntryId').value,entry=state.entries.find(x=>x.id===entryId),amount=Number($('#tipAmount').value),note=$('#tipNote').value.trim(),available=Math.max(0,totals()[actor]||0);if(!entry||entry.actor===actor)return toast('无法打赏这条足迹');if(!Number.isInteger(amount)||amount<1||amount>available)return toast('请输入可用积分以内的整数');closeModal();try{await api('tip',{from:actor,to:entry.actor,entryId,amount,note});toast('已打赏 '+amount+' 分给 '+entry.actor)}catch(e){toast(e.message)}}
function openProfile(){modal('<p style="color:var(--muted)">选择这部手机默认的记录人</p><div class="member-pick">'+state.members.map(m=>'<button class="'+(m===actor?'active':'')+'" onclick="chooseActor(\''+m+'\')">'+esc(m)+'</button>').join('')+'</div>','现在是谁？')}function chooseActor(m){actor=m;localStorage.actor=m;closeModal();render();toast('已切换为 '+m)}function editNames(){modal('<p class="hint">可以填写真实姓名，也可以用你们喜欢的昵称。</p><div class="field"><label>第一个人的名字</label><input id="memberOne" maxlength="12" value="'+esc(state.members[0])+'"></div><div class="field"><label>第二个人的名字</label><input id="memberTwo" maxlength="12" value="'+esc(state.members[1])+'"></div><button class="primary" style="width:100%" onclick="saveNames()">保存双方名字</button>','修改双方名字')}async function saveNames(){const old=[...state.members],members=[$('#memberOne').value.trim(),$('#memberTwo').value.trim()];if(!members[0]||!members[1])return toast('两个名字都要填写');if(members[0]===members[1])return toast('双方名字需要不同');closeModal();await api('renameMembers',{members});if(actor===old[0])actor=members[0];else if(actor===old[1])actor=members[1];else actor=members[0];localStorage.actor=actor;render();toast('双方名字已更新')}
function taskFields(t={}){const editing=Boolean(t.id),current=t.category||Object.keys(icons)[0],currentIcon=t.icon||icons[current]||'✨',cats=[...new Set([...Object.keys(icons),...state.tasks.map(x=>x.category),current])];return '<div class="form-grid"><div class="field"><label>图标</label><input id="taskIcon" value="'+esc(currentIcon)+'" maxlength="4"></div><div class="field"><label>家务名称</label><input id="taskName" value="'+esc(t.name||'')+'" placeholder="例如：给猫梳毛"></div></div><div class="field"><label>选择已有分类</label><select id="taskCat" '+(editing?'':'onchange="document.querySelector(\'#taskIcon\').value=icons[this.value]||\'✨\'"')+'>'+cats.map(c=>'<option value="'+esc(c)+'" '+(c===current?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>或新建自定义分类（可选）</label><input id="taskCatNew" maxlength="20" placeholder="例如：阳台"></div><div class="field"><label>完成一次获得多少积分</label><input id="taskPts" type="number" value="'+(t.points||10)+'" min="1" max="1000"></div><p class="hint">填写新分类时会优先使用新分类。修改只影响以后的记录。</p>'}function chosenTaskCategory(){return $('#taskCatNew').value.trim()||$('#taskCat').value.trim()}function newTask(){modal(taskFields()+'<button class="primary" style="width:100%" onclick="saveTask()">添加为新加分项</button>','添加自定义家务')}async function saveTask(){const name=$('#taskName').value.trim(),points=Number($('#taskPts').value),category=chosenTaskCategory(),icon=$('#taskIcon').value.trim()||'✨';if(!name||!category||!points)return toast('请填写完整');closeModal();await api('addTask',{name,points,category,icon});toast('新加分项已保存')}function editTask(id){const t=state.tasks.find(x=>x.id===id);modal(taskFields(t)+'<button class="primary" style="width:100%" onclick="updateTask(\''+id+'\')">保存修改</button><button class="danger" onclick="toggleTask(\''+id+'\','+(!t.active)+')">'+(t.active?'停用这个项目':'恢复这个项目')+'</button><button class="danger" onclick="deleteTask(\''+id+'\')">永久删除</button>','编辑加分项')}async function updateTask(id){const name=$('#taskName').value.trim(),points=Number($('#taskPts').value),category=chosenTaskCategory(),icon=$('#taskIcon').value.trim()||'✨';if(!name||!category||!points)return toast('请填写完整');closeModal();await api('updateTask',{taskId:id,name,points,category,icon});toast('修改已保存')}async function toggleTask(id,active){closeModal();await api('toggleTask',{taskId:id,active});toast(active?'项目已恢复':'项目已停用')}async function deleteTask(id){if(!confirm('确定永久删除这个加分项？过去的积分记录会保留。'))return;closeModal();await api('deleteTask',{taskId:id});toast('项目已删除')}
function rewardHistoryHtml(r,limit=99){const rows=state.redemptions.filter(x=>x.rewardId===r.id).slice().reverse().slice(0,limit);return '<div class="reward-history">'+(rows.length?rows.map(x=>'<div><span>'+esc(x.actor)+'</span><b>'+x.cost+' 分</b><small>'+ago(x.at)+'</small></div>').join(''):'<p class="hint">还没有投入记录。</p>')+'</div>'}function rewardDetail(id){const r=state.rewards.find(x=>x.id===id),comments=(state.rewardComments||[]).filter(x=>x.rewardId===id);if(!r)return toast('找不到心愿');modal('<div class="detail-summary"><span class="wish-icon">'+r.icon+'</span><b>'+esc(r.name)+'</b><small>'+r.cost+' 分 · '+(r.type==='共同'?'共同投入':'单独投入')+'</small></div><h4>投入记录</h4>'+rewardHistoryHtml(r)+'<h4>留言</h4><div class="comment-list">'+(comments.length?comments.map(x=>'<div><b>'+esc(x.actor)+'</b><p>'+esc(x.message)+'</p><small>'+ago(x.at)+'</small></div>').join(''):'<p class="hint">还没有留言。</p>')+'</div><div class="field"><label>添加留言</label><textarea id="rewardComment" rows="3" placeholder="关于这个心愿想说的话…"></textarea></div><button class="primary" style="width:100%" onclick="saveRewardComment(\''+id+'\')">发布留言</button>','心愿详情')}async function saveRewardComment(id){const message=$('#rewardComment').value.trim();if(!message)return toast('请先写下留言');closeModal();await api('commentReward',{rewardId:id,actor,message});toast('留言已发布')}function editReward(id){const r=state.rewards.find(x=>x.id===id),hasHistory=state.redemptions.some(x=>x.rewardId===id);modal('<div class="form-grid"><div class="field"><label>图标</label><input id="editRewardIcon" value="'+esc(r.icon)+'" maxlength="4"></div><div class="field"><label>心愿名称</label><input id="editRewardName" value="'+esc(r.name)+'"></div></div><div class="field"><label>目标积分</label><input id="editRewardCost" type="number" min="1" value="'+r.cost+'"></div><div class="field"><label>投入方式</label><select id="editRewardType" '+(hasHistory?'disabled':'')+'><option value="共同" '+(r.type==='共同'?'selected':'')+'>共同投入</option><option value="个人" '+(r.type==='个人'?'selected':'')+'>单独投入</option></select></div>'+(hasHistory?'<p class="hint">已有投入记录，不能切换投入方式；删除心愿会退还全部投入。</p>':'')+'<button class="primary" style="width:100%" onclick="saveRewardEdit(\''+id+'\')">保存修改</button><button class="danger" onclick="askDeleteReward(\''+id+'\')">删除心愿并退还投入</button>','编辑心愿')}async function saveRewardEdit(id){const name=$('#editRewardName').value.trim(),icon=$('#editRewardIcon').value.trim()||'✨',cost=Number($('#editRewardCost').value),type=$('#editRewardType').value;if(!name||!cost)return toast('请填写完整');closeModal();await api('updateReward',{rewardId:id,name,icon,cost,type});toast('心愿已更新')}function askDeleteReward(id){const r=state.rewards.find(x=>x.id===id);closeModal();modal('<p>确定删除「<b>'+esc(r.name)+'</b>」吗？</p><p class="hint">相关投入记录和留言会删除，已经投入的积分会退还给原投入人。</p><button class="danger" onclick="deleteReward(\''+id+'\')">确认删除心愿</button>','删除心愿')}async function deleteReward(id){closeModal();await api('deleteReward',{rewardId:id});toast('心愿已删除，投入已退还')}
function newWish(){modal('<div class="field"><label>心愿名称</label><input id="wishName" placeholder="例如：去看一场演出"></div><div class="field"><label>所需积分</label><input id="wishCost" type="number" value="500"></div><div class="field"><label>投入方式</label><select id="wishType"><option value="共同">共同投入（两人的投入合计）</option><option value="个人">单独投入（各自独立进度）</option></select></div><button class="primary" style="width:100%" onclick="saveWish()">加入心愿单</button>','添加心愿')}async function saveWish(){const name=$('#wishName').value.trim(),cost=Number($('#wishCost').value),type=$('#wishType').value;if(!name||!cost)return toast('请填写完整');closeModal();await api('addReward',{name,cost,type,icon:'✨'});toast('心愿已添加')}
function reward(id){const r=state.rewards.find(x=>x.id===id),t=totals(),p=r.type==='共同'?Number(r.progress||0):Number(r.progressByActor?.[actor]||0),remaining=Math.max(0,r.cost-p),limit=Math.min(Math.max(0,t[actor]||0),remaining);if(limit<1)return toast(remaining<1?'这个心愿已经实现':'当前没有可投入积分');modal('<h4>最近投入</h4>'+rewardHistoryHtml(r,5)+'<p style="color:var(--muted)">'+(r.type==='共同'?'投入会计入两人的共同进度':'只计入 '+esc(actor)+' 的个人进度')+'</p><div class="field"><label>手动输入投入积分</label><input id="amount" type="number" inputmode="numeric" placeholder="最多可投入 '+limit+' 分" min="1" max="'+limit+'"></div><button class="primary" style="width:100%" onclick="contribute(\''+id+'\')">确认投入</button>','投入 '+esc(r.name))}
async function contribute(id){const amount=Number($('#amount').value),t=totals();if(amount<1||amount>t[actor])return toast('请输入可用积分以内的数量');closeModal();await api('contribute',{rewardId:id,actor,amount});toast('共同心愿更近一步了')}
function thanks(){const other=state.members.find(x=>x!==actor)||'对方';modal('<p style="color:var(--muted)">写给 '+esc(other)+'</p><div class="field"><textarea id="thanksMsg" rows="4" placeholder="今天最想感谢你的事…"></textarea></div><button class="primary" style="width:100%" onclick="saveThanks()">送出感谢 ♡</button>','谢谢你')}async function saveThanks(){const message=$('#thanksMsg').value.trim();if(!message)return toast('写一句想说的话吧');closeModal();await api('thank',{from:actor,to:state.members.find(x=>x!==actor)||'对方',message});toast('感谢已送出')}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='我们的小家-备份.json';a.click();URL.revokeObjectURL(a.href)}
api().catch(()=>{$('#app').innerHTML='<div class="loading"><div class="logo">!</div><p>暂时无法连接，请稍后再试。</p><button class="primary" onclick="location.reload()">重新加载</button></div>'});setInterval(()=>api(null,{},true).catch(()=>{}),15000);if('serviceWorker'in navigator)navigator.serviceWorker.register(location.hostname==='chaojiabin.github.io'?'./sw.js':'/sw.js');</script></body></html>
